name: AKA CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Minitest Suite & SLA Verification
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      SECRET_KEY_BASE: "test-secret-key-base-for-ci-aka-sla-engine-00000000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '.ruby-version'
          bundler-cache: true

      - name: Make binstubs executable
        run: chmod +x bin/*

      - name: Prepare SQLite Test Database
        run: bundle exec rails db:test:prepare

      - name: Run Minitest Test Suite
        run: bundle exec rails test
