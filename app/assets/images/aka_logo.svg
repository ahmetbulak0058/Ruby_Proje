<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="akaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="akaAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="akaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- AKA Monogram Icon -->
  <g transform="translate(12, 12)">
    <!-- Base Squircle with Gradient -->
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#akaGradient)" filter="url(#akaShadow)"/>
    
    <!-- Stylized Geometric "A" with Pulse Crossbar -->
    <!-- Outer Peak of "A" -->
    <path d="M 28 14 L 42 42 L 35 42 L 31.5 35 L 24.5 35 L 21 42 L 14 42 Z" 
          fill="#FFFFFF" 
          opacity="0.95"/>
          
    <!-- Inner Cutout of "A" -->
    <polygon points="28,21 33,30 23,30" fill="url(#akaGradient)"/>
    
    <!-- Dynamic SLA Pulse Beam across the "A" -->
    <path d="M 8 35 L 18 35 L 22 28 L 26 40 L 30 32 L 34 35 L 48 35" 
          fill="none" 
          stroke="#22D3EE" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Glowing Status Beacon -->
    <circle cx="48" cy="35" r="2.5" fill="#38BDF8"/>
  </g>

  <!-- AKA Brand Wordmark -->
  <g transform="translate(82, 48)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="0.5">
      <tspan fill="#0F172A">A</tspan>
      <tspan fill="#4F46E5">K</tspan>
      <tspan fill="#06B6D4">A</tspan>
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(84, 64)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="9.5" 
          font-weight="700" 
          letter-spacing="2.5" 
          fill="#64748B" 
          text-transform="uppercase">
      Enterprise SLA &amp; Support
    </text>
  </g>
</svg>
