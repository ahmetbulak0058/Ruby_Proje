<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="pdGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Icon Container -->
  <g transform="translate(10, 12)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#pdGradient)" filter="url(#shadow)"/>
    <path d="M 12 28 L 20 28 L 24 18 L 30 38 L 36 24 L 40 28 L 44 28" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <circle cx="44" cy="28" r="2.5" fill="#22D3EE"/>
  </g>

  <!-- PulseDesk Wordmark -->
  <g transform="translate(80, 50)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="32" 
          font-weight="800" 
          letter-spacing="-0.5">
      <tspan fill="#0F172A">Pulse</tspan>
      <tspan fill="#4F46E5">Desk</tspan>
    </text>
  </g>

  <!-- Small Subtitle / Tagline -->
  <g transform="translate(82, 65)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="9" 
          font-weight="600" 
          letter-spacing="2.2" 
          fill="#64748B" 
          text-transform="uppercase">
      SLA &amp; Support Ops
    </text>
  </g>
</svg>
